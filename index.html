  <title>Intern Tracker · IT Department</title>

    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
     INTERN TRACKER — Neumorphic Dark · STLAF Brand Palette
     Font: Geist (SaaS/dev) · Accent: #365794 → #5F98B6 (deep blue → teal-blue)
     Slate: #3E5E72 · Gold highlight: #EBD47A
  ═══════════════════════════════════════════════════════════════ */

    :root {
      /* ── Surfaces ── */
      --bg: #0a0e14;
      --bg-sidebar: #080b10;
      --bg-card: #111823;
      --bg-card-hover: #161f2c;
      --bg-input: #0a0e14;
      --border: #212c3d;
      --border-soft: #19222f;

      /* ── Typography ── */
      --text: #e4e9f2;
      --text-dim: #8592a8;
      --text-faint: #4b5670;

      /* ── Accent: Deep Blue → Teal-Blue (STLAF brand) ── */
      --blue: #5f98b6;
      --indigo: #365794;
      --accent-gradient: linear-gradient(135deg, #365794 0%, #5f98b6 100%);
      --accent-glow: rgba(54, 87, 148, .32);
      --blue-dim: rgba(95, 152, 182, .14);
      --blue-line: rgba(95, 152, 182, .38);

      /* ── Semantic colors ── */
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, .13);
      --amber: #ebd47a;
      --amber-dim: rgba(235, 212, 122, .16);
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, .13);
      --purple: #6492b1;
      --purple-dim: rgba(100, 146, 177, .15);

      /* ── Neumorphic shadows (dark) ── */
      --neu: -4px -4px 9px rgba(255, 255, 255, .028), 5px 5px 14px rgba(0, 0, 0, .58);
      --neu-sm: -2px -2px 5px rgba(255, 255, 255, .022), 3px 3px 8px rgba(0, 0, 0, .52);
      --neu-inset: inset -2px -2px 5px rgba(255, 255, 255, .022), inset 3px 3px 8px rgba(0, 0, 0, .55);
      --neu-btn: -2px -2px 4px rgba(255, 255, 255, .03), 3px 3px 9px rgba(0, 0, 0, .62);
      --shadow: var(--neu);

      /* ── Shape ── */
      --radius: 16px;
      --radius-sm: 11px;
    }

    body.light {
      --bg: #eaeef4;
      --bg-sidebar: #e1e7f0;
      --bg-card: #eaeef4;
      --bg-card-hover: #f1f4fa;
      --bg-input: #e1e7f0;
      --border: #ccd6e6;
      --border-soft: #d6dfec;
      --text: #101a2c;
      --text-dim: #556074;
      --text-faint: #97a1b3;
      --blue-dim: rgba(54, 87, 148, .10);
      --green-dim: rgba(34, 197, 94, .10);
      --amber-dim: rgba(235, 212, 122, .24);
      --red-dim: rgba(239, 68, 68, .10);
      --purple-dim: rgba(100, 146, 177, .13);
      --neu: -3px -3px 7px rgba(255, 255, 255, .75), 4px 4px 10px rgba(150, 164, 200, .28);
      --neu-sm: -2px -2px 4px rgba(255, 255, 255, .65), 3px 3px 7px rgba(150, 164, 200, .22);
      --neu-inset: inset -2px -2px 5px rgba(255, 255, 255, .7), inset 3px 3px 7px rgba(150, 164, 200, .25);
      --shadow: var(--neu);
    }

    /* ── RESET ─────────────────────────────────────────────────────── */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .mono {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      width: auto;
      max-width: none;
      flex: none;
    }

    input,
    textarea,
    select {
      font-family: inherit;
    }

    ::placeholder {
      color: var(--text-faint);
    }

    /* ── LOGIN SCREEN ───────────────────────────────────────────────── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 50% at 15% 10%, rgba(54, 87, 148, .11) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(95, 152, 182, .11) 0%, transparent 60%);
      position: relative;
      overflow: hidden;
    }

      background-position: center;

      opacity: .16;
      filter: saturate(1.15);
      pointer-events: none;
      z-index: 0;
    }

    body.light .login-bg-logo {
      opacity: .09;
    }

    .login-bg-logo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 30%,
        rgba(255, 255, 255, .55) 47%,
        rgba(235, 212, 122, .85) 50%,
        rgba(255, 255, 255, .55) 53%,
        transparent 70%
      );
      background-size: 300% 100%;
      background-position: -100% 0;
      mix-blend-mode: overlay;
      animation: loginGlowSweep 4.5s ease-in-out infinite;
    }

    @keyframes loginGlowSweep {
      0% { background-position: -120% 0; }
      55% { background-position: 120% 0; }
      100% { background-position: 120% 0; }
    }

    .login-card {
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border-radius: 24px;
      padding: 38px 34px;
      box-shadow: var(--neu);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .5px;
      flex-shrink: 0;
      box-shadow: 0 4px 18px var(--accent-glow), var(--neu-btn);
    }

    .login-title {
      font-size: 15px;
      font-weight: 700;
    }

    .login-sub {
      font-size: 10.5px;
      color: var(--text-dim);
      letter-spacing: .09em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .login-heading {
      font-size: 24px;
      font-weight: 800;
      margin: 4px 0 7px;
      letter-spacing: -.02em;
    }

    .login-desc {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-bottom: 24px;
      line-height: 1.55;
    }

    .role-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      background: var(--bg-input);
      border-radius: 13px;
      padding: 4px;
      box-shadow: var(--neu-inset);
    }

    .role-tab {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      border: none;
      background: transparent;
      transition: .2s;
    }

    .role-tab.active {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: var(--neu-btn), 0 2px 10px var(--accent-glow);
    }

    /* ── FORM ELEMENTS ──────────────────────────────────────────────── */
    .field-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 8px;
      display: block;
    }

    select,
    input[type=text],
    input[type=email],
    input[type=password],
    input[type=date],
    textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1.5px solid transparent;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 13.5px;
      outline: none;
      box-shadow: var(--neu-inset);
      transition: border-color .2s, box-shadow .2s;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--indigo);
      box-shadow: var(--neu-inset), 0 0 0 3px rgba(54, 87, 148, .16);
    }

    /* ── BUTTONS ────────────────────────────────────────────────────── */
    .btn {
      box-sizing: border-box;
      border: none;
      border-radius: var(--radius-sm);
      min-height: 40px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: .18s;
    }

    .btn-full {
      display: flex;
      width: 100%;
      min-height: 42px;
      margin-top: 6px;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: var(--neu-btn), 0 4px 16px var(--accent-glow);
    }

    .btn-primary:hover {
      box-shadow: var(--neu-btn), 0 6px 22px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: var(--neu-inset);
    }

    .btn-ghost {
      background: var(--bg-card);
      color: var(--text-dim);
      border: 1.5px solid var(--border);
      box-shadow: var(--neu-sm);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--indigo);
    }

    .btn-soft {
      background: var(--blue-dim);
      color: var(--indigo);
      box-shadow: var(--neu-sm);
    }

    .btn-soft:hover {
      background: var(--blue-line);
    }

    .btn-danger-soft {
      background: var(--red-dim);
      color: var(--red);
      box-shadow: var(--neu-sm);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      min-height: 32px;
    }

    .hint {
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 8px;
      line-height: 1.5;
    }

    .err {
      font-size: 12px;
      color: var(--red);
      margin-top: 8px;
    }

    /* ── APP SHELL ──────────────────────────────────────────────────── */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      box-shadow: 4px 0 28px rgba(0, 0, 0, .45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 26px;
    }

    .menu-eyebrow {
      font-size: 10px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 700;
      padding: 0 12px;
      margin-bottom: 6px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-dim);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: .18s;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg-card-hover);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--blue-dim);
      color: var(--indigo);
      box-shadow: var(--neu-sm);
    }

    .nav-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-gradient);
      margin-left: auto;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .sidebar-spacer {
      flex: 1;
    }

    .sidebar-foot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--purple-dim);
      color: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12.5px;
      flex-shrink: 0;
      box-shadow: var(--neu-sm);
    }

    .user-card.super .avatar {
      background: var(--blue-dim);
      color: var(--indigo);
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    .user-role {
      font-size: 10px;
      color: var(--indigo);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
    }

    .main {
      margin-left: 260px;
      flex: 1;
      padding: 34px 40px 64px;
      max-width: 1200px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      color: var(--indigo);
      text-transform: uppercase;
      letter-spacing: .09em;
      margin-bottom: 6px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .page-desc {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-top: 5px;
    }

    /* ── CARDS / STATS ──────────────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--neu);
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--neu-sm);
    }

    .icon-badge svg {
      width: 18px;
      height: 18px;
    }

    .ib-blue {
      background: var(--blue-dim);
      color: var(--indigo);
    }

    .ib-green {
      background: var(--green-dim);
      color: var(--green);
    }

    .ib-amber {
      background: var(--amber-dim);
      color: var(--amber);
    }

    .ib-red {
      background: var(--red-dim);
      color: var(--red);
    }

    .ib-purple {
      background: var(--purple-dim);
      color: var(--purple);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 22px;

    /* ============================= IMAGE COMPRESSION ============================= */
    function fileToCompressedDataURL(file, maxW = 760, quality = 0.62) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('read failed'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('image decode failed'));
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

          .select('name, department')
          .order('name', { ascending: true });
        if (!error && data) {
          state.interns = data.map(i => i.name);
          state.internDepts = {};
          data.forEach(i => { state.internDepts[i.name] = i.department; });
        } else if (error) {
          console.warn('Failed to load interns from Supabase', error);
        }
      } catch (e) {
        console.warn('Failed to load interns from Supabase', e);
      }
    }

    /* ============================= TASKS SYNC (Supabase: tasks table) ============================= */
    async function loadTasks() {
      try {
        let query = window.db.from('tasks').select('*').order('created_at', { ascending: false });
        if (state.user.role !== 'supervisor') query = query.eq('intern_name', state.user.name);
        const { data, error } = await query;
        if (!error && data) {
          state.tasks = data.map(rowToTask);
        } else if (error) {
          console.warn('Failed to load tasks from Supabase', error);
        }
      } catch (e) {
        console.warn('Failed to load tasks from Supabase', e);
      }
    }
    function rowToTask(row) {
      return {
        id: row.id,
        intern: row.intern_name,
        title: row.title,
        description: row.description || '',
        dueDate: row.due_date,
        status: row.status,
        proofRemark: row.proof_remark,
        proofPhoto: row.proof_photo,
        completedAt: row.completed_at,
        createdAt: row.created_at ? new Date(row.created_at).getTime() : 0,
      };
    }

    /* ============================= DAILY LOGS SYNC (Supabase: daily_logs table) ============================= */
    function rowToDaily(row) {
      if (!row) return null;
      return {
        ticketing: row.ticketing || { mode: null, remark: '', photo: null },
        email: row.email || { mode: null, remark: '', photo: null },
        infographic: row.infographic || { items: { review: false, design: false, upload: false } },
        completedAt: row.completed_at,
      };
    }
    async function getDailyLog(internName, dateStr) {
      const { data, error } = await window.db
        .from('daily_logs')
        .select('*')
        .eq('intern_name', internName)
        .eq('log_date', dateStr)
        .maybeSingle();
      if (error) { console.warn('Failed to load daily log', error); return null; }
      return rowToDaily(data);
    }
    async function saveDailyLog(internName, dateStr, draft) {
      const { error } = await window.db
        .from('daily_logs')
        .upsert({
          intern_name: internName,
          log_date: dateStr,
          ticketing: draft.ticketing,
          email: draft.email,
          infographic: draft.infographic,
          completed_at: draft.completedAt,
        }, { onConflict: 'intern_name,log_date' });
      if (error) { console.error('Failed to save daily log', error); return false; }
      return true;
    }
    async function getDailyLogsForDate(dateStr, names) {
      let query = window.db.from('daily_logs').select('*').eq('log_date', dateStr);
      if (names && names.length) query = query.in('intern_name', names);
      const { data, error } = await query;
      if (error) { console.warn('Failed to load daily logs for date', error); return []; }
      return data.map(row => ({ name: row.intern_name, e: rowToDaily(row) }));
    }

    /* ============================= BOOT ============================= */
    async function boot() {
      await loadInterns();
      const { data: { session } } = await window.db.auth.getSession();

      if (session) {
        await handleSession(session);
      } else {
        showLogin();
      }

      window.db.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session) {
          await handleSession(session);
        } else if (event === 'SIGNED_OUT') {
          state.user = null;
          showLogin();
        } else if (event === 'TOKEN_REFRESHED' && session) {
          // no-op
        }
      });
    }

    async function handleSession(session) {
      await loadInterns();
      const profile = await fetchProfile();
      if (!profile) {
        const created = await ensureProfile(session.user);
        if (!created) {
          toast('Could not load your profile. Contact an administrator.', true);
          await window.db.auth.signOut();
          return;
        }
        state.user = { id: created.id, name: created.full_name, role: created.role };
      } else {
        state.user = { id: profile.id, name: profile.full_name, role: profile.role };
      }

      if (state.user.role === 'supervisor') {
        state.logInternSel = state.interns[0] || null;
      } else {
        state.logInternSel = state.user.name;
      }
      await loadTasks();
      showApp();
    }

    boot();

    /* ============================= LOGIN SCREEN ============================= */
    let loginRole = 'intern';
    let internLoginMode = 'existing'; // 'existing' | 'new'

    function showLogin() {
      document.getElementById('appShell').style.display = 'none';
      const root = document.getElementById('loginScreen');
      root.style.display = 'flex';
      root.innerHTML = `
    <div class="login-bg-logo"></div>
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-badge">IT</div>
        <div><div class="login-title">Intern Tracker</div><div class="login-sub">IT Department</div></div>
      </div>
      <div class="login-heading">Welcome back</div>
      <div class="login-desc">Sign in to log today's tasks or review the team's progress.</div>
      <div class="role-tabs">
        <button class="role-tab ${loginRole === 'intern' ? 'active' : ''}" data-action="set-login-role" data-role="intern">Intern</button>
        <button class="role-tab ${loginRole === 'supervisor' ? 'active' : ''}" data-action="set-login-role" data-role="supervisor">IT Supervisor</button>
      </div>
      ${loginRole === 'intern' ? renderInternLogin() : renderSupervisorLogin()}
    </div>

    function renderInternLogin() {

        <input type="password" name="password" id="internPw" placeholder="Enter your password" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit">${icon('arrow')} Continue as Intern</button>
      <div class="login-switch">Not on the list? <button type="button" data-action="set-intern-login-mode" data-mode="new">Register here</button></div>
    </form>

          <option value="">— Select your department —</option>
          ${deptOpts}
        </select>
      </div>

        <input type="password" name="password" placeholder="Create a password" required>

      <div class="login-switch">Already registered? <button type="button" data-action="set-intern-login-mode" data-mode="existing">Select your name</button></div>

    function renderSupervisorLogin() {
      return `
    <button class="btn btn-google btn-full" style="margin-bottom:0" data-action="login-google">
      <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
    <div class="hint" style="margin-top:12px;text-align:center;">Supervisor access is verified via your Google account.</div>
  `;
    }

    function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    /* ============================= LOGIN EVENTS ============================= */
    document.getElementById('loginScreen').addEventListener('click', e => {
      const roleBtn = e.target.closest('[data-action="set-login-role"]');
      if (roleBtn) { loginRole = roleBtn.dataset.role; internLoginMode = 'existing'; showLogin(); }

      const modeBtn = e.target.closest('[data-action="set-intern-login-mode"]');
      if (modeBtn) { internLoginMode = modeBtn.dataset.mode; showLogin(); }

      const googleBtn = e.target.closest('[data-action="login-google"]');
      if (googleBtn) loginWithGoogle();
    });

    document.getElementById('loginScreen').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;

      if (form.dataset.action === 'login-intern') {
        const name = form.existing.value;
        const password = form.password.value;
        if (!name) { toast('Please select your name.', true); return; }
        if (!password) { toast('Please enter your password.', true); return; }

        const { data: row, error: fetchErr } = await window.db
          .from('interns').select('password').eq('name', name).maybeSingle();
        if (fetchErr) { toast('Could not verify your account. Try again.', true); return; }
        if (!row || !row.password) {
          const { error: setErr } = await window.db.from('interns').update({ password }).eq('name', name);
          if (setErr) { toast('Could not set your password.', true); return; }
          toast('Password set for your account. Welcome!');
        } else if (row.password !== password) {
          toast('Incorrect password. Try again.', true);
          return;
        }

        state.user = { id: null, name, role: 'intern' };
        state.logInternSel = name;
        await loadTasks();
        showApp();
        return;
      }

      if (form.dataset.action === 'register-intern') {
        const newName = form.newName.value.trim();
        const password = form.password.value;
        const deptSel = form.department.value;
        if (!newName) { toast('Please type your full name to register.', true); return; }
        if (!deptSel) { toast('Please select your department.', true); return; }
        if (!password) { toast('Please create a password.', true); return; }

        if (state.interns.includes(newName)) {
          const { data: row, error: fetchErr } = await window.db
            .from('interns').select('password').eq('name', newName).maybeSingle();
          if (fetchErr) { toast('Could not verify your account. Try again.', true); return; }
          if (row && row.password && row.password !== password) {
            toast('That name already exists. Wrong password.', true);
            return;
          }
          if (row && !row.password) {
            await window.db.from('interns').update({ password }).eq('name', newName);
          }
        } else {
          const { error: insErr } = await window.db
            .from('interns').insert({ name: newName, department: deptSel, password });
          if (insErr) { toast('Could not create your account.', true); return; }
          state.interns.push(newName);
          state.internDepts[newName] = deptSel;
          toast('Account created. Welcome, ' + newName + '!');
        }

        state.user = { id: null, name: newName, role: 'intern' };
        state.logInternSel = newName;
        await loadTasks();
        showApp();
        return;
      }
    });

    async function loginWithGoogle() {
      const redirectTo = window.location.href.split('?')[0].split('#')[0];
      const { error } = await window.db.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo,
          queryParams: { access_type: 'offline', prompt: 'select_account' },
        },
      });
      if (error) toast(error.message || 'Google sign-in failed', true);
    }

    /* ============================= APP SHELL ============================= */
    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      scheduleDailyRollover();
      renderSidebar();
      navigate('dashboard');
    }

    function renderSidebar() {

        : [['dashboard', 'grid', 'Dashboard'], ['dailylog', 'clipboard', 'Daily Log'], ['tasks', 'check2', 'Assigned Tasks']];

    <button class="nav-item ${state.view === v ? 'active' : ''}" data-action="nav" data-view="${v}">
      ${icon(i)}<span class="label-text">${label}</span>
    </button>`).join('');
      document.getElementById('sidebar').innerHTML = `
    <div class="brand">
      <div class="logo-badge">IT</div>
      <div class="brand-text"><div class="login-title">Intern Tracker</div><div class="login-sub" style="font-size:9.5px">IT DEPARTMENT</div></div>

    <nav class="nav">${nav}</nav>
    <div class="sidebar-spacer"></div>

        <div class="avatar">${initials(state.user.name)}</div>
        <div class="user-text">
          <div class="user-name">${escapeHtml(state.user.name)}</div>
          <div class="user-role">${state.user.role === 'supervisor' ? 'Supervisor' : 'Intern'}</div>
        </div>
      </div>
      <button class="nav-item" data-action="toggle-theme">${icon('sun')}<span class="label-text">Toggle Theme</span></button>
      <button class="nav-item" data-action="logout">${icon('logout')}<span class="label-text">Sign Out</span></button>
    </div>
  `;
    }

    function navigate(view) {
      state.view = view;
      renderSidebar();
      const c = document.getElementById('mainContent');
      if (view === 'dashboard') renderDashboard(c);
      else if (view === 'dailylog') renderDailyLogPage(c);
      else if (view === 'tasks') renderTasksPage(c);
      else if (view === 'team') renderTeamPage(c);
    }

    /* ============================= DASHBOARD ============================= */
    async function renderDashboard(container) {
      container.innerHTML = `<div class="empty-state">Loading dashboard…</div>`;
      const today = todayStr();
      const thu = isThursday(today);

      let ticketDone = 0, emailDone = 0, infoDone = 0, infoTotal = 0;
      const names = state.user.role === 'supervisor' ? state.interns : [state.user.name];
      const entries = await getDailyLogsForDate(today, names);
      for (const { e } of entries) {
        if (e.ticketing && (e.ticketing.photo || (e.ticketing.remark || '').trim())) ticketDone++;
        if (e.email && (e.email.photo || (e.email.remark || '').trim())) emailDone++;
        if (thu && e.infographic) {
          infoTotal++;
          const it = e.infographic.items || {};
          if (it.review && it.design && it.upload) infoDone++;
        }
      }
      const pendingTasks = state.tasks.filter(t => t.status === 'pending' && (state.user.role === 'supervisor' || t.intern === state.user.name));
      const totalInterns = state.interns.length;

      const statCards = state.user.role === 'supervisor' ? `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Total Interns</div><div class="stat-value">${totalInterns}</div></div><div class="icon-badge ib-purple">${icon('users')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Tickets Logged Today</div><div class="stat-value">${ticketDone}/${totalInterns}</div></div><div class="icon-badge ib-blue">${icon('ticket')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Email Issues Logged</div><div class="stat-value">${emailDone}/${totalInterns}</div></div><div class="icon-badge ib-green">${icon('mail')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Pending Assigned Tasks</div><div class="stat-value">${pendingTasks.length}</div></div><div class="icon-badge ib-amber">${icon('bolt')}</div></div></div>
    </div>
  ` : `
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Ticketing — Today</div><div class="stat-value">${ticketDone ? 'Logged' : '—'}</div></div><div class="icon-badge ib-blue">${icon('ticket')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Email Issues — Today</div><div class="stat-value">${emailDone ? 'Logged' : '—'}</div></div><div class="icon-badge ib-green">${icon('mail')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Infographic (Thu)</div><div class="stat-value">${thu ? (infoDone ? 'Done' : 'Pending') : '—'}</div></div><div class="icon-badge ib-amber">${icon('image')}</div></div></div>
      <div class="card stat-card"><div class="stat-top"><div><div class="stat-label">Pending Tasks</div><div class="stat-value">${pendingTasks.length}</div></div><div class="icon-badge ib-red">${icon('bolt')}</div></div></div>
    </div>
  `;

      const activityRows = entries.length ? entries.map(({ name, e }) => `
    <tr>
      <td><span class="id-link">${escapeHtml(name)}</span></td>
      <td>${statusPill(e.ticketing)}</td>
      <td>${statusPill(e.email)}</td>
      <td>${thu ? infoPill(e.infographic) : '<span class="pill pill-gray">N/A</span>'}</td>
    </tr>`).join('') : '';

      container.innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Overview</div>
        <div class="page-title">Dashboard</div>
        <div class="page-desc">${state.user.role === 'supervisor' ? "Monitor the team's daily task submissions" : "Today's task status at a glance"} · ${fmtDate(today)}</div>
      </div>
      <button class="btn btn-primary" data-action="nav" data-view="dailylog">${icon('clipboard')} ${state.user.role === 'supervisor' ? 'View All Logs' : "Log Today's Tasks"}</button>
    </div>
    ${statCards}
    <div class="row-2">
      <div class="section-card">
        <div class="section-head">
          <div><div class="section-title">${state.user.role === 'supervisor' ? "Today's Submissions" : "Recent Activity"}</div><div class="section-sub">${fmtDate(today)}</div></div>
          <a class="link-more" data-action="nav" data-view="dailylog">View All →</a>
        </div>
        ${entries.length ? `
        <table>
          <thead><tr><th>${state.user.role === 'supervisor' ? 'Intern' : 'Category'}</th><th>Ticketing</th><th>Email</th><th>Infographic</th></tr></thead>
          <tbody>${activityRows}</tbody>
        </table>` : `<div class="empty-state">${icon('note')}<div>No entries logged yet today.</div></div>`}
      </div>
      <div class="section-card">
        <div class="section-head"><div class="section-title">Assigned Tasks</div><a class="link-more" data-action="nav" data-view="tasks">View All →</a></div>
        ${pendingTasks.length ? pendingTasks.slice(0, 4).map(t => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border-soft)">
            <div style="font-size:12.5px;font-weight:700">${escapeHtml(t.title)}</div>
            <div style="font-size:11px;color:var(--text-faint);margin-top:2px">${state.user.role === 'supervisor' ? escapeHtml(t.intern) : (t.dueDate ? ('Due ' + fmtDate(t.dueDate)) : 'No due date')}</div>
          </div>`).join('') : `<div class="empty-state">${icon('check2')}<div>No pending tasks.</div></div>`}
      </div>
    </div>
  `;
    }
    function statusPill(section) {
      if (!section) return '<span class="pill pill-gray">Not logged</span>';
      if (section.photo) return '<span class="pill pill-green">Ticket photo</span>';
      if ((section.remark || '').trim()) return '<span class="pill pill-blue">Remark</span>';
      return '<span class="pill pill-gray">Not logged</span>';
    }
    function infoPill(info) {
      if (!info) return '<span class="pill pill-gray">Not started</span>';
      const it = info.items || {};
      const n = [it.review, it.design, it.upload].filter(Boolean).length;
      if (n === 3) return '<span class="pill pill-green">Complete</span>';
      if (n > 0) return '<span class="pill pill-amber">' + n + '/3</span>';
      return '<span class="pill pill-gray">Not started</span>';
    }

    /* ============================= DAILY LOG PAGE ============================= */
    async function renderDailyLogPage(container) {
      container.innerHTML = `<div class="empty-state">Loading…</div>`;
      if (state.user.role === 'supervisor') {
        if (!state.logInternSel) state.logInternSel = state.interns[0] || null;
        await renderSupervisorDailyLog(container);
      } else {
        await renderInternDailyLog(container);
      }
    }

    async function renderSupervisorDailyLog(container) {
      const deptOpts = ['', ...DEPARTMENTS].map(d =>
        `<option value="${d}" ${state.deptFilter === d ? 'selected' : ''}>${d || 'All Departments'}</option>`
      ).join('');

      const filteredInterns = state.deptFilter
        ? state.interns.filter(n => state.internDepts[n] === state.deptFilter)
        : state.interns;

      if (!state.logInternSel || !filteredInterns.includes(state.logInternSel)) {
        state.logInternSel = filteredInterns[0] || null;
      }

      const internOpts = filteredInterns.map(n =>
        `<option value="${escapeHtml(n)}" ${state.logInternSel === n ? 'selected' : ''}>${escapeHtml(n)}</option>`
      ).join('');

      container.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Daily Logs</div><div class="page-title">Team Daily Task Log</div><div class="page-desc">Review what each intern submitted for a given day.</div></div>
    </div>
    <div class="toolbar">
      <input type="date" id="dlDate" value="${state.dateSel}">
      <select id="dlDept">${deptOpts}</select>
      <select id="dlIntern">
        <option value="">— Select intern —</option>
        ${internOpts}
      </select>
    </div>
    <div id="dlBody"></div>
  `;
      document.getElementById('dlDate').addEventListener('change', e => { state.dateSel = e.target.value; renderSupervisorDailyLogBody(); });
      document.getElementById('dlDept').addEventListener('change', e => {
        state.deptFilter = e.target.value;
        const fi = state.deptFilter
          ? state.interns.filter(n => state.internDepts[n] === state.deptFilter)
          : state.interns;
        state.logInternSel = fi[0] || null;
        const sel = document.getElementById('dlIntern');
        sel.innerHTML = '<option value="">— Select intern —</option>' +
          fi.map(n => `<option value="${escapeHtml(n)}" ${state.logInternSel === n ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
        renderSupervisorDailyLogBody();
      });
      document.getElementById('dlIntern').addEventListener('change', e => { state.logInternSel = e.target.value || null; renderSupervisorDailyLogBody(); });
      await renderSupervisorDailyLogBody();
    }

    async function renderSupervisorDailyLogBody() {
      const body = document.getElementById('dlBody');
      if (!body) return;
      if (!state.logInternSel) { body.innerHTML = `<div class="empty-state">${icon('users')}<div>No interns added yet. Add one from the Team page.</div></div>`; return; }
      body.innerHTML = `<div class="empty-state">Loading…</div>`;
      const e = await getDailyLog(state.logInternSel, state.dateSel);
      const thu = isThursday(state.dateSel);
      body.innerHTML = `
    ${readonlyTaskBlock(1, 'ticket', 'Ticketing System Support', 'Tickets handled across departments', e && e.ticketing)}
    ${readonlyTaskBlock(2, 'mail', 'Email Issue Resolution', 'Bounce-back / send failures resolved', e && e.email)}
    ${thu ? readonlyInfographicBlock(e && e.infographic) : ''}
  `;
    }
    function readonlyTaskBlock(num, iconName, title, sub, section) {
      let body;
      if (!section || (!section.photo && !(section.remark || '').trim())) {
        body = `<div class="empty-state">${icon('note')}<div>Not logged for this day.</div></div>`;
      } else if (section.photo) {
        body = `<div class="photo-preview"><img src="${section.photo}"></div>`;
      } else {
        body = `<div style="font-size:13px;color:var(--text-dim);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px">${escapeHtml(section.remark)}</div>`;
      }
      return `<div class="task-block"><div class="task-block-head"><div class="task-num">${num}</div><div><div class="task-block-title">${title}</div><div class="task-block-sub">${sub}</div></div></div>${body}</div>`;
    }
    function readonlyInfographicBlock(info) {
      const it = (info && info.items) || {};
      const rows = [['review', 'Reviewed the IT Updates sheet'], ['design', 'Designed the infographic in Canva'], ['upload', 'Uploaded before Thursday deadline']];
      return `<div class="task-block"><div class="task-block-head"><div class="task-num">3</div><div><div class="task-block-title">IT Awareness Infographic</div><div class="task-block-sub">Thursday weekly checklist</div></div></div>
    ${rows.map(([k, label]) => `<div class="check-row"><div class="checkbox ${it[k] ? 'checked' : ''}">${it[k] ? icon('check2') : ''}</div><div><div class="check-label">${label}</div></div></div>`).join('')}
  </div>`;
    }

    async function renderInternDailyLog(container) {
      state.dateSel = todayStr();
      container.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Daily Log</div><div class="page-title">Log Your Daily Tasks</div><div class="page-desc">Fill this in every day before you sign off.</div></div>
    </div>
    <div class="toolbar"><span class="pill pill-blue">${icon('calendar')} Today · ${fmtDate(state.dateSel)}</span></div>
    <div id="dlBody"></div>
  `;
      await loadDraftAndRender();
    }
    async function loadDraftAndRender() {
      const name = state.user.name;
      const existing = await getDailyLog(name, state.dateSel);
      state.draft = existing || newDailyDraft();
      renderDraft();
    }
    function renderDraft() {
      const body = document.getElementById('dlBody');
      if (!body) return;
      if (state.draft.completedAt) {
        body.innerHTML = `
      <div class="thu-banner">${icon('check2')} Daily task completed for ${fmtDate(state.dateSel)}. A new log will be available tomorrow.</div>
      ${readonlyTaskBlock(1, 'ticket', 'Ticketing System Support', 'Tickets handled across departments', state.draft.ticketing)}
      ${readonlyTaskBlock(2, 'mail', 'Email Issue Resolution', 'Bounce-back / send failures resolved', state.draft.email)}
      ${isThursday(state.dateSel) ? readonlyInfographicBlock(state.draft.infographic) : ''}
    `;
        return;
      }
      const thu = isThursday(state.dateSel);
      body.innerHTML = `
    ${editableTaskBlock(1, 'ticket', 'Ticketing System Support', 'Log a ticket you handled today', 'ticketing', 'No ticket was submitted today.')}
    ${editableTaskBlock(2, 'mail', 'Email Issue Resolution', 'Bounce-back / unable-to-send fixes', 'email', 'No email issue request came in today.')}
    ${thu ? `<div class="thu-banner">${icon('calendar')} It's Thursday — the IT Awareness infographic is due today.</div>` : ''}
    ${editableInfographicBlock()}
    <div class="save-bar">
      <button class="btn btn-ghost" data-action="reset-draft">Discard Changes</button>
      <button class="btn btn-primary" data-action="save-daily">${icon('check2')} Save Daily Log</button>
    </div>
  `;
    }
    function editableTaskBlock(num, iconName, title, sub, key, quickRemark) {
      const d = state.draft[key];
      const mode = d.mode;
      return `
  <div class="task-block">
    <div class="task-block-head"><div class="task-num">${num}</div><div><div class="task-block-title">${title}</div><div class="task-block-sub">${sub}</div></div></div>
    <div class="mode-toggle">
      <button type="button" class="mode-btn ${mode === 'photo' ? 'active' : ''}" data-action="set-mode" data-key="${key}" data-mode="photo">${icon('camera')} Upload Photo</button>
      <button type="button" class="mode-btn ${mode === 'remark' ? 'active' : ''}" data-action="set-mode" data-key="${key}" data-mode="remark">${icon('note')} Write Remark</button>
    </div>
    ${mode === 'photo' ? photoField(key, d.photo) : ''}
    ${mode === 'remark' ? `
      <textarea data-bind="${key}.remark" placeholder="Describe what was handled, or note that nothing came in today...">${escapeHtml(d.remark || '')}</textarea>
      <button type="button" class="quick-btn" data-action="quick-remark" data-key="${key}" data-text="${escapeHtml(quickRemark)}">Use: "${quickRemark}"</button>
    ` : ''}
    ${!mode ? `<div class="empty-state">${icon('arrow')}<div>Choose how you'd like to log this task.</div></div>` : ''}
  </div>`;
    }
    function photoField(key, photo) {
      if (photo) {
        return `<div class="photo-preview"><img src="${photo}"><button type="button" class="photo-remove" data-action="remove-photo" data-key="${key}">${icon('x')}</button></div>`;
      }
      return `
    <label class="dropzone" style="display:block">
      ${icon('camera')}
      <p>Tap to upload a photo of the ticket</p>
      <span>JPG or PNG</span>
      <input type="file" accept="image/*" data-photo-input="${key}" style="display:none">
    </label>`;
    }
    function editableInfographicBlock() {
      const it = state.draft.infographic.items;
      const n = [it.review, it.design, it.upload].filter(Boolean).length;
      const rows = [
        ['review', 'Reviewed the IT Updates sheet', 'Content shared by the IT Supervisor'],
        ['design', 'Designed the infographic in Canva', 'Clear, professional, on-brand'],
        ['upload', 'Uploaded before Thursday deadline', 'Posted to the team channel'],
      ];
      return `
  <div class="task-block">
    <div class="task-block-head"><div class="task-num">3</div><div><div class="task-block-title">IT Awareness Infographic</div><div class="task-block-sub">Weekly checklist — relevant every Thursday</div></div></div>
    ${rows.map(([k, label, s]) => `
      <div class="check-row" data-action="toggle-check" data-key="${k}" style="cursor:pointer">
        <div class="checkbox ${it[k] ? 'checked' : ''}">${it[k] ? icon('check2') : ''}</div>
        <div><div class="check-label">${label}</div><div class="check-sub">${s}</div></div>
      </div>`).join('')}
    <div class="progress-bar"><div style="width:${(n / 3 * 100)}%"></div></div>
  </div>`;
    }

    /* ============================= ASSIGNED TASKS PAGE ============================= */
    async function renderTasksPage(container) {
      const isSup = state.user.role === 'supervisor';
      const myTasks = isSup ? state.tasks : state.tasks.filter(t => t.intern === state.user.name);
      const filtered = state.taskFilter === 'all' ? myTasks : myTasks.filter(t => t.status === state.taskFilter);
      filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      container.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Additional Tasks</div><div class="page-title">Assigned Tasks</div><div class="page-desc">${isSup ? 'Assign extra work and track completion.' : 'Tasks your supervisor has assigned to you.'}</div></div>
      ${isSup ? `<button class="btn btn-primary" data-action="open-assign-modal">${icon('plus')} Assign Task</button>` : ''}
    </div>
    <div class="toolbar">
      <div class="seg">
        <button class="${state.taskFilter === 'all' ? 'active' : ''}" data-action="set-task-filter" data-f="all">All</button>
        <button class="${state.taskFilter === 'pending' ? 'active' : ''}" data-action="set-task-filter" data-f="pending">Pending</button>
        <button class="${state.taskFilter === 'done' ? 'active' : ''}" data-action="set-task-filter" data-f="done">Done</button>
      </div>
    </div>
    <div id="taskList">
      ${filtered.length ? filtered.map(t => taskCard(t, isSup)).join('') : `<div class="empty-state">${icon('bolt')}<div>No tasks here.</div></div>`}
    </div>
  `;
    }
    function taskCard(t, isSup) {
      return `
  <div class="task-card">
    <div>
      <div class="task-card-title">${escapeHtml(t.title)}</div>
      ${t.description ? `<div class="task-card-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="task-meta">
        ${isSup ? `<span class="meta-chip">${icon('users')} ${escapeHtml(t.intern)}</span>` : ''}
        ${t.dueDate ? `<span class="meta-chip">${icon('calendar')} Due ${fmtDate(t.dueDate)}</span>` : ''}
        ${t.status === 'done' && t.completedAt ? `<span class="meta-chip">${icon('clock')} Completed ${fmtDate(t.completedAt)}</span>` : ''}
      </div>
      ${t.status === 'done' && (t.proofRemark || t.proofPhoto) ? `
        <div style="margin-top:10px">
          ${t.proofPhoto ? `<div class="photo-preview" style="max-width:260px"><img src="${t.proofPhoto}"></div>` : ''}
          ${t.proofRemark ? `<div style="font-size:12px;color:var(--text-dim);margin-top:6px">${escapeHtml(t.proofRemark)}</div>` : ''}
        </div>` : ''}
    </div>
    <div class="task-card-actions">
      <span class="pill ${t.status === 'done' ? 'pill-green' : 'pill-amber'}">${t.status === 'done' ? 'Done' : 'Pending'}</span>
      ${!isSup && t.status === 'pending' ? `<button class="btn btn-soft btn-sm" data-action="open-complete-modal" data-id="${t.id}">Mark as Done</button>` : ''}
      ${isSup ? `<button class="btn btn-danger-soft btn-sm" data-action="delete-task" data-id="${t.id}">${icon('trash')}</button>` : ''}
    </div>
  </div>`;
    }

    /* ============================= TEAM PAGE ============================= */
    function renderTeamPage(container) {
      container.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Team</div><div class="page-title">Interns</div><div class="page-desc">Manage who can log daily tasks.</div></div>
      <button class="btn btn-primary" data-action="open-add-intern">${icon('plus')} Add Intern</button>
    </div>
    <div class="section-card">
      ${state.interns.length ? `
        <table>
          <thead><tr><th>Name</th><th>Action</th></tr></thead>
          <tbody>${state.interns.map(n => `
            <tr>
              <td><span class="id-link">${escapeHtml(n)}</span></td>
              <td><button class="btn btn-danger-soft btn-sm" data-action="remove-intern" data-name="${escapeHtml(n)}">${icon('trash')} Remove</button></td>
            </tr>`).join('')}
          </tbody>
        </table>` :
          `<div class="empty-state">${icon('users')}<div>No interns yet. Add one above.</div></div>`}
    </div>
  `;
    }

    /* ============================= MODALS ============================= */
    function openModal(html) {
      state.modalOpen = true;
      document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay">${html}</div>`;
    }
    function closeModal() {
      state.modalOpen = false;
      document.getElementById('modalRoot').innerHTML = '';
    }

    function openAssignModal() {
      const opts = state.interns.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
      openModal(`
    <div class="modal">
      <div class="modal-head"><div class="modal-title">Assign Task</div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div>
      <form data-action="submit-assign">
        <div class="field"><label class="field-label">Intern</label><select name="intern">${opts}</select></div>
        <div class="field"><label class="field-label">Task Title</label><input type="text" name="title" placeholder="e.g. Update inventory sheet" required></div>
        <div class="field"><label class="field-label">Description (optional)</label><textarea name="desc" placeholder="More details…"></textarea></div>
        <div class="field"><label class="field-label">Due Date (optional)</label><input type="date" name="due"></div>
        <div class="save-bar"><button class="btn btn-ghost" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${icon('plus')} Assign</button></div>
      </form>
    </div>`);
    }

    function openCompleteModal(id) {
      openModal(`
    <div class="modal">
      <div class="modal-head"><div class="modal-title">Mark Task as Done</div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div>
      <form data-action="submit-complete" data-id="${id}">
        <div class="field"><label class="field-label">Proof Remark (optional)</label><textarea name="remark" placeholder="How was it completed?"></textarea></div>
        <div class="field"><label class="field-label">Proof Photo (optional)</label>
          <label class="dropzone" style="display:block">
            ${icon('camera')}<p>Upload a screenshot or photo</p><span>JPG or PNG</span>
            <input type="file" accept="image/*" id="proofPhotoInput" style="display:none">
          </label>
          <div id="proofPhotoPreview"></div>
        </div>
        <div class="save-bar"><button class="btn btn-ghost" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${icon('check2')} Mark Done</button></div>
      </form>
    </div>`);
      document.getElementById('proofPhotoInput').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        const url = await fileToCompressedDataURL(file);
        document.getElementById('proofPhotoPreview').innerHTML = `<div class="photo-preview" style="margin-top:8px"><img src="${url}"><button type="button" class="photo-remove" id="clearProofPhoto">${icon('x')}</button></div>`;
        document.getElementById('clearProofPhoto').onclick = () => { document.getElementById('proofPhotoPreview').innerHTML = ''; document.getElementById('proofPhotoInput').value = ''; };
      });
    }

    function openAddInternModal() {
      const deptOpts = DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join('');
      openModal(`
    <div class="modal">
      <div class="modal-head"><div class="modal-title">Add Intern</div><button class="modal-close" data-action="close-modal">${icon('x')}</button></div>
      <form data-action="submit-add-intern">
        <div class="field"><label class="field-label">Full Name</label><input type="text" name="name" placeholder="e.g. Maria Santos" required></div>
        <div class="field"><label class="field-label">Department</label><select name="department">${deptOpts}</select></div>
        <div class="save-bar"><button class="btn btn-ghost" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${icon('plus')} Add</button></div>
      </form>
    </div>`);
    }

    /* ============================= GLOBAL EVENT DELEGATION ============================= */
    document.addEventListener('click', async e => {
      const navBtn = e.target.closest('[data-action="nav"]');
      if (navBtn) { navigate(navBtn.dataset.view); return; }

      if (e.target.closest('[data-action="toggle-theme"]')) { document.body.classList.toggle('light'); return; }

      if (e.target.closest('[data-action="logout"]')) {
        await window.db.auth.signOut();
        state.user = null;
        state.tasks = [];
        showLogin();
        return;
      }

      if (e.target.closest('[data-action="close-modal"]')) { closeModal(); return; }
      if (e.target.closest('[data-action="open-assign-modal"]')) { openAssignModal(); return; }
      if (e.target.closest('[data-action="open-add-intern"]')) { openAddInternModal(); return; }

      const completeBtn = e.target.closest('[data-action="open-complete-modal"]');
      if (completeBtn) { openCompleteModal(completeBtn.dataset.id); return; }

      const delBtn = e.target.closest('[data-action="delete-task"]');
      if (delBtn) {
        const { error } = await window.db.from('tasks').delete().eq('id', delBtn.dataset.id);
        if (error) { toast('Could not remove task.', true); return; }
        state.tasks = state.tasks.filter(t => t.id !== delBtn.dataset.id);
        renderTasksPage(document.getElementById('mainContent'));
        toast('Task removed.');
        return;
      }

      const remBtn = e.target.closest('[data-action="remove-intern"]');
      if (remBtn) {
        const { error } = await window.db.from('interns').delete().eq('name', remBtn.dataset.name);
        if (error) { toast('Could not remove intern.', true); return; }
        state.interns = state.interns.filter(n => n !== remBtn.dataset.name);
        renderTeamPage(document.getElementById('mainContent'));
        toast('Intern removed.');
        return;
      }

      const modeBtn = e.target.closest('[data-action="set-mode"]');
      if (modeBtn) {
        const { key, mode } = modeBtn.dataset;
        state.draft[key].mode = state.draft[key].mode === mode ? null : mode;
        renderDraft(); return;
      }

      const rmPhoto = e.target.closest('[data-action="remove-photo"]');
      if (rmPhoto) { state.draft[rmPhoto.dataset.key].photo = null; renderDraft(); return; }

      const qb = e.target.closest('[data-action="quick-remark"]');
      if (qb) {
        state.draft[qb.dataset.key].remark = qb.dataset.text;
        const ta = document.querySelector(`[data-bind="${qb.dataset.key}.remark"]`);
        if (ta) ta.value = qb.dataset.text;
        return;
      }

      const checkRow = e.target.closest('[data-action="toggle-check"]');
      if (checkRow) {
        const k = checkRow.dataset.key;
        state.draft.infographic.items[k] = !state.draft.infographic.items[k];
        renderDraft(); return;
      }

      if (e.target.closest('[data-action="reset-draft"]')) { state.draft = newDailyDraft(); renderDraft(); return; }

      if (e.target.closest('[data-action="save-daily"]')) {
        document.querySelectorAll('[data-bind]').forEach(el => {
          const [k, f] = el.dataset.bind.split('.');
          if (state.draft[k]) state.draft[k][f] = el.value;
        });
        state.draft.completedAt = new Date().toISOString();
        const ok = await saveDailyLog(state.user.name, state.dateSel, state.draft);
        if (!ok) { toast('Could not save daily log. Try again.', true); state.draft.completedAt = null; return; }
        renderDraft();
        toast('Daily log saved!');
        return;
      }

      const filterBtn = e.target.closest('[data-action="set-task-filter"]');
      if (filterBtn) {
        state.taskFilter = filterBtn.dataset.f;
        renderTasksPage(document.getElementById('mainContent')); return;
      }
    });

    /* ============================= FILE INPUTS ============================= */
    document.addEventListener('change', async e => {
      const photoInput = e.target.closest('[data-photo-input]');
      if (photoInput && photoInput.files[0]) {
        const key = photoInput.dataset.photoInput;
        const url = await fileToCompressedDataURL(photoInput.files[0]);
        state.draft[key].photo = url;
        renderDraft();
        return;
      }
    });

    /* ============================= FORM SUBMISSIONS ============================= */
    document.addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;

      if (form.dataset.action === 'submit-assign') {
        const { data, error } = await window.db.from('tasks').insert({
          intern_name: form.intern.value,
          title: form.title.value.trim(),
          description: form.desc.value.trim(),
          due_date: form.due.value || null,
          status: 'pending',
        }).select('*').single();
        if (error) { toast('Could not assign task.', true); return; }
        state.tasks.unshift(rowToTask(data));
        closeModal();
        renderTasksPage(document.getElementById('mainContent'));
        toast('Task assigned!');
        return;
      }

      if (form.dataset.action === 'submit-complete') {
        const id = form.dataset.id;
        const remark = form.remark.value.trim();
        const previewImg = document.querySelector('#proofPhotoPreview img');
        const photo = previewImg ? previewImg.src : null;
        const { error } = await window.db.from('tasks').update({
          status: 'done', proof_remark: remark, proof_photo: photo, completed_at: todayStr(),
        }).eq('id', id);
        if (error) { toast('Could not mark task as done.', true); return; }
        state.tasks = state.tasks.map(t => t.id === id
          ? { ...t, status: 'done', proofRemark: remark, proofPhoto: photo, completedAt: todayStr() }
          : t);
        closeModal();
        renderTasksPage(document.getElementById('mainContent'));
        toast('Task marked as done!');
        return;
      }

      if (form.dataset.action === 'submit-add-intern') {
        const name = form.name.value.trim();
        if (!name) return;
        if (!state.interns.includes(name)) {
          const dept = form.department.value || DEPARTMENTS[0];
          const { error } = await window.db.from('interns').insert({ name, department: dept });
          if (error) { toast('Could not add intern.', true); return; }
          state.interns.push(name);
          state.internDepts[name] = dept;
        }
        closeModal();
        renderTeamPage(document.getElementById('mainContent'));
        toast('Intern added!');
        return;
      }
    });
  </script>
</body>

</html>
